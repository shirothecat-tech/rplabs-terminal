name: RP Labs Daily Macro Engine Update

on:
  schedule:
    # Berjalan otomatis setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  
  # Tombol manual "Run workflow" di GitHub Actions
  workflow_dispatch:

jobs:
  update-macro-json:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode dari repository
      - name: Checkout Repo
        uses: actions/checkout@v3

      # 2. Siapkan Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install library yang dibutuhkan backend
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      # 4. Jalankan script backend (Membaca API Key dari Github Secrets)
      - name: Run Macro Data Generator
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python generate_macro_data.py

      # 5. Commit dan Push otomatis file macro_bias.json terbaru
      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add macro_bias.json
          git commit -m "Auto-update macro_bias.json [skip ci]" || exit 0
          git push